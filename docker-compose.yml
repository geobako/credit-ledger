name: acme-credit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme_credit
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acme -d acme_credit']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-off migration job (mirrors a pre-deploy task in the cloud). The API never migrates on boot.
  migrate:
    build:
      context: .
      dockerfile: apps/lending-api/Dockerfile
    # Migrations, then demo identities for the simulated IdP.
    command: ['sh', '-c', 'node dist/database/migrate.js && node dist/database/seed.js']
    environment:
      DATABASE_URL: postgres://acme:acme@postgres:5432/acme_credit
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  lending-api:
    build:
      context: .
      dockerfile: apps/lending-api/Dockerfile
    environment:
      # 'development' (not production) so the sandbox simulator and ephemeral JWT keys are allowed.
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://acme:acme@postgres:5432/acme_credit
      # Local-only values. In the cloud these come from Secrets Manager (see infra/).
      WEBHOOK_SECRET: local-dev-webhook-secret-change-me-0123456789
      GATEWAY_SHARED_SECRET: local-dev-gateway-secret-change-me-0123456789
      SANDBOX_ENABLED: 'true'
      WEB_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 5s
      timeout: 3s
      retries: 20

  # Card-network-facing edge. Holds no balances: it validates, rate limits, enforces deadlines
  # and signs every call to the lending API.
  card-gateway:
    build:
      context: apps/card-gateway
    environment:
      PORT: 8081
      LENDING_API_URL: http://lending-api:3000
      GATEWAY_SHARED_SECRET: local-dev-gateway-secret-change-me-0123456789
      NETWORK_API_KEY: local-dev-network-key-change-me
      AUTH_TIMEOUT_MS: 1500
    ports:
      - '8081:8081'
    depends_on:
      lending-api:
        condition: service_healthy

volumes:
  pgdata:
