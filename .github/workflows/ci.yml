name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript · lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration · lending-api against real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts a throwaway Postgres per run on the runner's Docker.
      - run: pnpm --filter lending-api test:int

  go:
    name: Go · card gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/card-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/card-gateway/go.mod
          cache-dependency-path: apps/card-gateway/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  e2e:
    name: E2E · full stack in Docker, then a load smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typescript, go]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: End-to-end suite
        run: pnpm --filter e2e e2e
      - name: Load smoke test (k6)
        run: |
          pnpm --filter e2e load:seed 50
          docker run --rm --network acme-credit_default \
            -v "$PWD/load:/load" -w /load \
            -e DURATION=20s -e RATE=20 \
            grafana/k6:1.3.0 run authorize.k6.js
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
